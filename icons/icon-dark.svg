<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="OpenTiles">
  <title>OpenTiles</title>
  <defs>
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"></feGaussianBlur>
    </filter>
    <filter id="ground-blur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"></feGaussianBlur>
    </filter>
  </defs>
  <rect id="bg" width="1024" height="1024" rx="229" ry="229" fill="#12161F"></rect>
  <g id="glow" filter="url(#glow-blur)" opacity="0.5" transform="translate(0 26)">
    <rect x="202" y="202" width="282" height="282" rx="67" ry="67" fill="#0A84FF"></rect>
    <rect x="540" y="202" width="282" height="282" rx="67" ry="67" fill="#BF5AF2"></rect>
    <rect x="202" y="540" width="282" height="282" rx="67" ry="67" fill="#30D158"></rect>
    <rect x="540" y="540" width="282" height="282" rx="67" ry="67" fill="#FF9F0A"></rect>
  </g>
  <g id="tiles">
    <rect id="tile-tl" x="202" y="202" width="282" height="282" rx="67" ry="67" fill="#0A84FF"></rect>
    <rect id="tile-tr" x="540" y="202" width="282" height="282" rx="67" ry="67" fill="#BF5AF2"></rect>
    <rect id="tile-bl" x="202" y="540" width="282" height="282" rx="67" ry="67" fill="#30D158"></rect>
    <rect id="tile-br" x="540" y="540" width="282" height="282" rx="67" ry="67" fill="#FF9F0A"></rect>
  </g>
</svg>