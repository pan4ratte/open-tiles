<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="../fonts/inter.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="gb-floating is-loading">
  <!-- The background, behind everything; hidden until one is chosen. A still
       one is painted by the div, a moving one by the video - whichever is not
       in use is left empty, so nothing is decoded for a layer nobody sees.
       Muted and inline, which is what lets it play without a click. -->
  <div class="bg" id="bg" aria-hidden="true" hidden>
    <div class="bg__image" id="bgImage"></div>
    <video class="bg__video" id="bgVideo" muted loop autoplay playsinline
           disablepictureinpicture hidden></video>
    <div class="bg__veil"></div>
  </div>

  <!-- Tile groups: a floating HUD pill above the clock, or a bar across the
       window. Chips are built in newtab.js from the saved groups. -->
  <nav class="groupbar" id="groupBar" data-i18n-label="page_groupbar">
    <div class="groupbar__inner" id="groupChips"></div>

    <!-- The search field, which takes the chips' place while it is up. Inside
         the block rather than beside it, because the block is what knows where
         it stands - floating pill, status bar, or set in the page above the
         tiles - and the field is meant to arrive exactly there. Both are
         .groupbar__inner, so both are given that placement's own material. -->
    <div class="groupbar__inner groupbar__search" id="search" hidden>
      <span class="search__glyph" data-icon="search" data-icon-size="14"></span>
      <input class="search__field" id="searchField" type="text"
             data-i18n-placeholder="search_placeholder"
             data-i18n-label="search_placeholder"
             autocomplete="off" spellcheck="false">
      <button class="search__close" type="button" id="btnSearchClose"
              data-i18n-title="search_close" data-i18n-label="search_close"
              data-icon="x" data-icon-size="13"></button>
    </div>
  </nav>

  <div class="toolbar">
    <button class="toolbtn" id="btnSearch" type="button"
            data-i18n-title="page_search" data-i18n-label="page_search"
            aria-pressed="false"
            data-icon="search" data-icon-size="18"></button>
    <button class="toolbtn" id="btnSettings" type="button"
            data-i18n-title="page_settings" data-i18n-label="page_settings"
            data-icon="settings" data-icon-size="18"></button>
  </div>

  <main class="page">
    <!-- The outline of the page, standing in for it until there is something
         to draw: a block where the clock goes, and a row of tiles' worth of
         grid. Markup rather than something the script builds, because the
         moment it is for is the one before any script has run - it is on
         screen in the very first paint.

         The blocks are real .tile elements with nothing in them, so the
         outline is the shape the tiles will actually take rather than a
         guess at it. Taken off the page for good once the real thing is up;
         see boot in newtab.js. -->
    <div class="skeleton" id="skeleton" aria-hidden="true">
      <div class="skeleton__header">
        <span class="skeleton__clock"></span>
      </div>
      <div class="grid skeleton__grid">
        <span class="tile tile--ghost"></span>
        <span class="tile tile--ghost"></span>
        <span class="tile tile--ghost"></span>
        <span class="tile tile--ghost"></span>
        <span class="tile tile--ghost"></span>
        <span class="tile tile--ghost"></span>
        <span class="tile tile--ghost"></span>
        <span class="tile tile--ghost"></span>
      </div>
    </div>

    <header class="page__header" id="header">
      <h1 class="page__clock" id="clock">--:--</h1>
      <p class="page__date" id="date" hidden></p>
    </header>

    <section class="grid" id="grid" data-i18n-label="page_grid"></section>

    <p class="empty" id="empty" data-i18n="empty_noTiles" hidden></p>
  </main>

  <!-- Add / edit tile. A sheet: it belongs to the page it interrupts, so it
       comes down from the top edge and is dismissed by its own buttons. -->
  <div class="modal sheet" id="modal" tabindex="-1" role="dialog" aria-modal="true"
       aria-labelledby="modalTitle" hidden>
    <form class="sheet__box" id="tileForm">
      <h2 class="sheet__title" id="modalTitle" data-i18n="tile_addTitle"></h2>
      <p class="sheet__subtitle" data-i18n="tile_sheetNote"></p>

      <div class="sheet__body">
        <label class="field">
          <span class="field__label" data-i18n="tile_url"></span>
          <input class="field__input" id="fieldUrl" type="text"
                 data-i18n-placeholder="tile_urlPlaceholder" required
                 autocomplete="off" spellcheck="false">
        </label>

        <label class="field">
          <span class="field__label"><span data-i18n="tile_name"></span>
            <em data-i18n="tile_optional"></em></span>
          <input class="field__input" id="fieldTitle" type="text"
                 data-i18n-placeholder="tile_namePlaceholder" autocomplete="off">
        </label>

        <!-- A div, not a label: it holds buttons of its own, and a button
             inside a label steals the click meant for the field. -->
        <div class="field">
          <span class="field__label" data-i18n="tile_appearance"></span>

          <!-- The tile above, the things that shape it underneath: each is a
               row of its own, so no control has to share a line with the
               picture it changes. -->
          <div class="tilefield">
            <!-- The tile as it will really be drawn: same classes, same custom
                 properties, so shape, size, padding and label all follow the
                 settings without this having to know any of them. -->
            <div class="tilefield__stage">
              <div class="tile tile--preview" id="tilePreview"></div>
              <!-- Under the tile: it carries the colour being pointed at, and
                   a hex code should not wrap. -->
              <span class="tilefield__hint" id="pipetteHint" hidden></span>
              <!-- What the icon lookup found, said where the icon it is
                   talking about can be seen. -->
              <p class="status" id="iconStatus" hidden></p>
            </div>

            <div class="tilefield__rows">
              <div class="tilefield__group">
                <label class="tilefield__sub" for="fieldIcon">
                  <span data-i18n="tile_icon"></span> <em data-i18n="tile_optional"></em>
                </label>
                <div class="tilefield__row">
                  <input class="field__input" id="fieldIcon" type="text"
                         data-i18n-placeholder="tile_iconPlaceholder"
                         autocomplete="off" spellcheck="false">
                  <button class="btn btn--sm" type="button" id="btnIconReload"
                          data-i18n-title="tile_iconReload"
                          data-i18n-label="tile_iconReload"
                          data-icon="refresh-cw" data-icon-size="15"></button>
                  <button class="btn btn--sm" type="button" id="btnIconFile"
                          data-i18n-title="tile_iconFile"
                          data-i18n-label="tile_iconFile"
                          data-icon="upload" data-icon-size="15"></button>
                  <input class="file-input" id="fieldIconFile" type="file" accept="image/*">
                </div>
                <!-- Two of the three ways in leave no mark on the sheet, so
                     they are said out loud rather than left to be discovered. -->
                <p class="tilefield__note" id="iconHelp" data-i18n="tile_iconHelp">
                  <span class="tilefield__key" data-i18n-slot
                        data-icon="upload" data-icon-size="12"></span>
                </p>
              </div>

              <div class="tilefield__group">
                <span class="tilefield__sub" data-i18n="tile_iconColor"></span>
                <!-- The colour well is built in newtab.js, from the same
                     picker the accent uses. -->
                <div class="tilefield__row" id="tileIconRow">
                  <button class="btn btn--sm" type="button" id="btnIconPipette"
                          data-i18n-title="tile_pipette"
                          data-i18n-label="tile_pipette"
                          aria-pressed="false"
                          data-icon="pipette" data-icon-size="15"></button>
                  <button class="btn btn--sm" type="button" id="btnIconColorClear"
                          data-i18n-title="tile_iconColorClear"
                          data-i18n-label="tile_iconColorClear"
                          data-icon="rotate-ccw" data-icon-size="15"></button>
                </div>
              </div>

              <div class="tilefield__group">
                <span class="tilefield__sub" data-i18n="tile_bg"></span>
                <div class="tilefield__row" id="tileBgRow">
                  <button class="btn btn--sm" type="button" id="btnPipette"
                          data-i18n-title="tile_pipette"
                          data-i18n-label="tile_pipette"
                          aria-pressed="false"
                          data-icon="pipette" data-icon-size="15"></button>
                  <button class="btn btn--sm" type="button" id="btnBgClear"
                          data-i18n-title="tile_bgClear"
                          data-i18n-label="tile_bgClear"
                          data-icon="rotate-ccw" data-icon-size="15"></button>
                </div>
              </div>

              <div class="tilefield__group">
                <span class="tilefield__sub" data-i18n="tile_pad"></span>
                <!-- The slider is built in newtab.js, from the same control
                     the Logo padding setting uses. -->
                <div class="tilefield__row" id="tilePadRow">
                  <button class="btn btn--sm" type="button" id="btnPadClear"
                          data-i18n-title="tile_padClear"
                          data-i18n-label="tile_padClear"
                          data-icon="rotate-ccw" data-icon-size="15"></button>
                </div>
              </div>

              <div class="tilefield__group">
                <span class="tilefield__sub" data-i18n="tile_round"></span>
                <!-- The slider is built in newtab.js, from the same control
                     the padding above uses. -->
                <div class="tilefield__row" id="tileRoundRow">
                  <button class="btn btn--sm" type="button" id="btnRoundClear"
                          data-i18n-title="tile_roundClear"
                          data-i18n-label="tile_roundClear"
                          data-icon="rotate-ccw" data-icon-size="15"></button>
                </div>
              </div>

              <!-- Whether this one tile carries its name, whatever Show site
                   names is set to. A checkbox rather than a switch: this is a
                   sheet, and nothing in it happens until Save - which is the
                   line macOS draws between the two controls. Its own label,
                   so there is no heading above it like the rows before.

                   No arrow back to the setting beside it: giving one tile up
                   is a rare thing to want and a whole button to carry on every
                   visit to this sheet, so it is done for all of them at once
                   from Settings - see clearTileLabels in newtab.js. -->
              <div class="tilefield__group">
                <div class="tilefield__row">
                  <label class="check">
                    <input id="fieldShowLabel" type="checkbox">
                    <span class="check__box" data-icon="check" data-icon-size="11"></span>
                    <span class="check__text" data-i18n="tile_showLabel"></span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <label class="field">
          <span class="field__label" data-i18n="tile_group"></span>
          <span class="popup">
            <select class="select" id="fieldGroup"></select>
            <span class="popup__chevron" data-icon="chevrons-up-down" data-icon-size="13"></span>
          </span>
        </label>

        <p class="status status--error" id="modalError" hidden></p>
      </div>

      <div class="sheet__actions">
        <button class="btn btn--danger" type="button" id="btnDelete" hidden>
          <span class="btn__icon" data-icon="trash-2" data-icon-size="14"></span
          ><span data-i18n="btn_delete"></span>
        </button>
        <span class="sheet__spacer"></span>
        <button class="btn" type="button" id="btnCancel" data-i18n="btn_cancel"></button>
        <button class="btn btn--primary" type="submit" id="btnSave" data-i18n="btn_save"></button>
      </div>
    </form>
  </div>

  <!-- Settings. A window rather than a sheet: it stands on its own, so it is
       centred, fully rounded, and closed from its toolbar. -->
  <div class="modal window" id="settings" tabindex="-1" role="dialog" aria-modal="true"
       data-i18n-label="settings_title" hidden>
    <form class="window__box" id="settingsForm">
      <div class="window__toolbar">
        <h2 class="window__title" id="settingsTitle" data-i18n="settings_title"></h2>
        <span class="window__spacer"></span>
        <button class="toolbtn" type="button" id="btnSettingsClose"
                data-i18n-title="btn_close" data-i18n-label="btn_close"
                data-icon="x" data-icon-size="16"></button>
      </div>

      <div class="window__body" id="settingsBody"></div>
    </form>
  </div>

  <!-- Add / edit group -->
  <div class="modal sheet" id="groupModal" tabindex="-1" role="dialog" aria-modal="true"
       aria-labelledby="groupModalTitle" hidden>
    <form class="sheet__box" id="groupForm">
      <h2 class="sheet__title" id="groupModalTitle" data-i18n="group_new"></h2>
      <p class="sheet__subtitle" data-i18n="group_sheetNote"></p>

      <div class="sheet__body">
        <label class="field">
          <span class="field__label" data-i18n="group_name"></span>
          <input class="field__input" id="fieldGroupName" type="text" required
                 data-i18n-placeholder="group_namePlaceholder"
                 autocomplete="off" maxlength="32">
        </label>

        <p class="status status--error" id="groupError" hidden></p>
      </div>

      <div class="sheet__actions">
        <button class="btn btn--danger" type="button" id="btnGroupDelete" hidden>
          <span class="btn__icon" data-icon="trash-2" data-icon-size="14"></span
          ><span data-i18n="btn_delete"></span>
        </button>
        <span class="sheet__spacer"></span>
        <button class="btn" type="button" id="btnGroupCancel" data-i18n="btn_cancel"></button>
        <button class="btn btn--primary" type="submit" data-i18n="btn_save"></button>
      </div>
    </form>
  </div>

  <!-- Which group a tile put back from the archive should go to, asked only
       when the one it was filed under has been deleted while it was away.
       After the settings window in the file, because that is what it is
       raised from and every dialog here is stacked by document order. -->
  <div class="modal sheet" id="archiveGroup" tabindex="-1" role="dialog" aria-modal="true"
       aria-labelledby="archiveGroupTitle" hidden>
    <form class="sheet__box" id="archiveGroupForm">
      <h2 class="sheet__title" id="archiveGroupTitle" data-i18n="archive_pickTitle"></h2>
      <p class="sheet__subtitle" id="archiveGroupNote"></p>

      <div class="sheet__body">
        <label class="field">
          <span class="field__label" data-i18n="archive_pickGroup"></span>
          <span class="popup">
            <select class="select" id="fieldArchiveGroup"></select>
            <span class="popup__chevron" data-icon="chevrons-up-down" data-icon-size="13"></span>
          </span>
        </label>
      </div>

      <div class="sheet__actions">
        <span class="sheet__spacer"></span>
        <button class="btn" type="button" id="btnArchiveGroupCancel" data-i18n="btn_cancel"></button>
        <button class="btn btn--primary" type="submit" data-i18n="btn_restore"></button>
      </div>
    </form>
  </div>

  <!-- The alert that stands in front of something that cannot be undone. It
       has no title bar and no close button: an alert is answered, not
       dismissed. Last in the file, so it stands over every other dialog. -->
  <div class="modal alert" id="confirmAlert" tabindex="-1" role="alertdialog" aria-modal="true"
       aria-labelledby="confirmTitle" aria-describedby="confirmText" hidden>
    <div class="alert__box">
      <span class="alert__glyph" data-icon="trash-2" data-icon-size="24"></span>
      <h2 class="alert__title" id="confirmTitle" data-i18n="confirm_deleteTitle"></h2>
      <p class="alert__text" id="confirmText"></p>
      <div class="alert__actions">
        <button class="btn" type="button" id="btnConfirmCancel" data-i18n="btn_cancel"></button>
        <button class="btn btn--destructive" type="button" id="btnConfirmOk"
                data-i18n="btn_delete"></button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="schema.js"></script>
  <script src="storage.js"></script>
  <script src="fonts.js"></script>
  <script src="backgrounds.js"></script>
  <script src="importers.js"></script>
  <script src="transfer.js"></script>
  <script src="favicons.js"></script>
  <script src="settings.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
