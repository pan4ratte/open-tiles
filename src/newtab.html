<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="../fonts/inter.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="gb-floating">
  <!-- Apple's app-icon squircle, once, in objectBoundingBox units so the one
       path fits an icon of any size. Site icons are clipped to it. -->
  <svg width="0" height="0" aria-hidden="true" focusable="false"
       style="position:absolute">
    <defs>
      <clipPath id="squircle" clipPathUnits="objectBoundingBox">
        <path d="M0,.5 C0,.108 .108,0 .5,0 C.892,0 1,.108 1,.5
                 C1,.892 .892,1 .5,1 C.108,1 0,.892 0,.5 Z"/>
      </clipPath>
    </defs>
  </svg>

  <!-- The picture, behind everything; hidden until one is chosen. -->
  <div class="bg" id="bg" aria-hidden="true" hidden>
    <div class="bg__image" id="bgImage"></div>
    <div class="bg__veil"></div>
  </div>

  <!-- Tile groups: a floating HUD pill above the clock, or a bar across the
       window. Chips are built in newtab.js from the saved groups. -->
  <nav class="groupbar" id="groupBar" aria-label="Tile groups">
    <div class="groupbar__inner" id="groupChips"></div>
  </nav>

  <div class="toolbar">
    <button class="toolbtn" id="btnSettings" type="button" title="Settings"
            aria-label="Settings" data-icon="settings" data-icon-size="18"></button>
  </div>

  <main class="page">
    <header class="page__header" id="header">
      <h1 class="page__clock" id="clock">--:--</h1>
      <p class="page__date" id="date" hidden></p>
    </header>

    <section class="grid" id="grid" aria-label="Quick access tiles"></section>

    <p class="empty" id="empty" hidden>No tiles yet. Hit <strong>+</strong> to add your first site.</p>
  </main>

  <!-- Add / edit tile. A sheet: it belongs to the page it interrupts, so it
       comes down from the top edge and is dismissed by its own buttons. -->
  <div class="modal sheet" id="modal" role="dialog" aria-modal="true"
       aria-labelledby="modalTitle" hidden>
    <form class="sheet__box" id="tileForm">
      <h2 class="sheet__title" id="modalTitle">Add tile</h2>
      <p class="sheet__subtitle">Type an address — the rest is filled in for you.</p>

      <div class="sheet__body">
        <label class="field">
          <span class="field__label">URL</span>
          <input class="field__input" id="fieldUrl" type="text" placeholder="example.com" required
                 autocomplete="off" spellcheck="false">
        </label>

        <label class="field">
          <span class="field__label">Name <em>(optional)</em></span>
          <input class="field__input" id="fieldTitle" type="text" placeholder="Example"
                 autocomplete="off">
        </label>

        <label class="field">
          <span class="field__label">Group</span>
          <span class="popup">
            <select class="select" id="fieldGroup"></select>
            <span class="popup__chevron" data-icon="chevrons-up-down" data-icon-size="13"></span>
          </span>
        </label>

        <p class="status status--error" id="modalError" hidden></p>
      </div>

      <div class="sheet__actions">
        <button class="btn btn--danger" type="button" id="btnDelete" hidden>
          <span class="btn__icon" data-icon="trash-2" data-icon-size="14"></span>Delete
        </button>
        <span class="sheet__spacer"></span>
        <button class="btn" type="button" id="btnCancel">Cancel</button>
        <button class="btn btn--primary" type="submit" id="btnSave">Save</button>
      </div>
    </form>
  </div>

  <!-- Settings. A window rather than a sheet: it stands on its own, so it is
       centred, fully rounded, and closed from its toolbar. -->
  <div class="modal window" id="settings" role="dialog" aria-modal="true"
       aria-label="Settings" hidden>
    <form class="window__box" id="settingsForm">
      <div class="window__toolbar">
        <h2 class="window__title">Settings</h2>
        <span class="window__spacer"></span>
        <button class="toolbtn" type="button" id="btnSettingsClose" title="Close"
                aria-label="Close" data-icon="x" data-icon-size="16"></button>
      </div>

      <div class="window__body" id="settingsBody"></div>
    </form>
  </div>

  <!-- Add / edit group -->
  <div class="modal sheet" id="groupModal" role="dialog" aria-modal="true"
       aria-labelledby="groupModalTitle" hidden>
    <form class="sheet__box" id="groupForm">
      <h2 class="sheet__title" id="groupModalTitle">New group</h2>
      <p class="sheet__subtitle">Drag tiles onto a group to put them in it.</p>

      <div class="sheet__body">
        <label class="field">
          <span class="field__label">Name</span>
          <input class="field__input" id="fieldGroupName" type="text" placeholder="Work" required
                 autocomplete="off" maxlength="32">
        </label>

        <p class="status status--error" id="groupError" hidden></p>
      </div>

      <div class="sheet__actions">
        <button class="btn btn--danger" type="button" id="btnGroupDelete" hidden>
          <span class="btn__icon" data-icon="trash-2" data-icon-size="14"></span>Delete
        </button>
        <span class="sheet__spacer"></span>
        <button class="btn" type="button" id="btnGroupCancel">Cancel</button>
        <button class="btn btn--primary" type="submit">Save</button>
      </div>
    </form>
  </div>

  <script src="icons.js"></script>
  <script src="schema.js"></script>
  <script src="storage.js"></script>
  <script src="fonts.js"></script>
  <script src="backgrounds.js"></script>
  <script src="favicons.js"></script>
  <script src="settings.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
